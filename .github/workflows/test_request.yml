name: Request Switcher

on:
  workflow_dispatch: # GitHubのタブから手動で実行できるようにする

jobs:
  run-requests:
    runs-on: ubuntu-latest
    
    # 自由に変更できる設定値
    env:
      INTERVAL_SECONDS: 0   # 交互に送る際の間隔（秒）
      REPEAT_COUNT: 5       # 繰り返す回数（セット数）
      ROOM_ID: "2237769"
      ACTOR_ID: "17607248"
      SESSION_KEY: "1"

    steps:
      - name: Send alternating POST requests
        run: |
          URL="https://zinro.net/m/player.php"
          
          echo "=== 処理を開始します (全 ${{ env.REPEAT_COUNT }} 回 / 間隔 ${{ env.INTERVAL_SECONDS }} 秒) ==="
          
          for ((i=1; i<=${{ env.REPEAT_COUNT }}; i++)); do
            echo "--- 実行回数: $i / ${{ env.REPEAT_COUNT }} ---"
            
            # 1. play の送信
            echo "Sending 'play' request..."
            curl -s -X POST "$URL" \
              -b "session_key=${{ env.SESSION_KEY }}" \
              -d "mode=switch_participation&room_id=${{ env.ROOM_ID }}&actor_id=${{ env.ACTOR_ID }}&participation=play"
            echo ""
            
            # 指定秒数待機
            sleep ${{ env.INTERVAL_SECONDS }}
            
            # 2. watch の送信
            echo "Sending 'watch' request..."
            curl -s -X POST "$URL" \
              -b "session_key=${{ env.SESSION_KEY }}" \
              -d "mode=switch_participation&room_id=${{ env.ROOM_ID }}&actor_id=${{ env.ACTOR_ID }}&participation=watch"
            echo ""
            
            # 最後の回でなければ待機する
            if [ $i -lt ${{ env.REPEAT_COUNT }} ]; then
              sleep ${{ env.INTERVAL_SECONDS }}
            fi
          done
          
          echo "=== すべての処理が完了しました ==="
